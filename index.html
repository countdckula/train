<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>trains</title>
<style>
:root{--bg:#000;--fg:#d4d4d4;--dim:#6e6e6e;--hi:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark;background:#000}
body{margin:0;background:var(--bg);color:var(--fg);font:12px/1.5 "Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,ui-monospace,monospace}
#t{max-width:620px;margin:0 auto;padding:20px 16px 56px}
pre{margin:0;font:inherit;white-space:pre}
.scroll{overflow-x:auto}
.dim{color:var(--dim)}.hi{color:var(--hi)}.g{color:#3fdc6e}.b{font-weight:700}
.hr{border-top:1px dashed var(--dim);margin:14px 0}
.row{display:flex;gap:1ch;align-items:center}
#q{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--hi);font:inherit;caret-color:var(--hi);caret-shape:block}
.r{display:block;position:relative;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:6px 10px 6px 3ch;cursor:pointer}
.r.on{background:var(--fg);color:#000}
.r.on::before{content:">";position:absolute;left:1ch}
.r.on .dim{color:#3a3a3a}
.r.on .g{color:#0a6b2c}
.r:focus-visible,.back:focus-visible{outline:1px solid var(--hi);outline-offset:1px}
.back{background:none;border:0;color:var(--dim);font:inherit;cursor:pointer;padding:0}
.back:hover{color:var(--hi)}
.me{color:var(--hi);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#brand.on{position:relative;z-index:1001}
#mx{position:fixed;inset:0;width:100%;height:100%;z-index:1000;background:#000;pointer-events:none;transition:opacity .6s}
#amap{line-height:1.2;margin:0}
.ml{color:#262626}.mc{color:#5c5c5c}.mr{color:#3fdc6e}.ms{color:#fff}.mt{color:#a8a8a8}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="t">
  <div><span id="brand"><span class="g b">trains</span> <span class="dim">india</span></span></div>
  <div class="dim">search runs locally (0 api calls) · live status from RailRadar only when you open a train</div>
  <div class="row" style="margin-top:10px">
    <input id="apiKey" type="password" autocomplete="off" placeholder="RailRadar API key" aria-label="RailRadar API key" style="flex:1;min-width:0;background:transparent;border:1px solid #444;padding:7px;color:#fff;font:inherit">
    <button id="saveKey" class="back" style="border:1px solid #444;padding:6px 10px">save key</button>
  </div>
  <div id="apiMsg" class="dim" style="margin-top:4px">API key required · stored in this browser only</div>
  <div id="calls" class="dim"></div>
  <div class="hr"></div>

  <section id="search">
    <label class="row"><span class="hi">$ find</span><input id="q" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="train no, name or station" aria-label="search trains" autofocus></label>
    <div id="res" style="margin-top:10px"></div>
  </section>

  <section id="detail" hidden>
    <div class="row" style="justify-content:space-between">
      <button class="back" id="back">&lt; back to search (esc)</button>
      <button class="back" id="refresh">[r] refresh (1 call)</button>
    </div>
    <div style="margin-top:12px"><span id="dn" class="hi b"></span> <span id="dt" class="dim"></span></div>
    <div id="ds" style="margin-top:4px"></div>
    <div id="rcRow" hidden style="margin-top:10px">
      <div class="dim">railradar failed. add a railcore key to use it as backup.</div>
      <div class="row" style="margin-top:6px">
        <input id="rcKey" type="password" autocomplete="off" placeholder="RailCore API key" aria-label="RailCore API key" style="flex:1;min-width:0;background:transparent;border:1px solid #444;padding:7px;color:#fff;font:inherit">
        <button id="saveRc" class="back" style="border:1px solid #444;padding:6px 10px">save + retry</button>
      </div>
    </div>
    <div class="dim" id="mapcap" style="margin-top:14px">route map (approximate)</div>
    <div class="scroll" style="margin-top:6px"><pre id="amap" aria-label="route map"></pre></div>
    <div class="scroll" style="margin-top:14px"><pre id="map"></pre></div>
  </section>
</div>

async function apiRC(path){
  const token=rkey();
  if(!token)throw new Error("no RailCore key");
  /* browsers only allow certain request headers cross-site, so try each header RailCore accepts and remember the one that works */
  const names=["Authorization","X-Api-Key","X-RailCore-Key"];
  const first=Math.min(2,Math.max(0,+localStorage.getItem("rc_hdr")||0));
  const order=[first,...[0,1,2].filter(i=>i!==first)];
  let last=null;
  for(const i of order){
    const headers={Accept:"application/json"};
    headers[names[i]]=i===0?"Bearer "+token:token;
    let response;
    try{response=await fetch("https://ir.railcore.tech/v1"+path,{headers})}
    catch(e){last=e;continue}
    bumpRC();
    try{localStorage.setItem("rc_hdr",String(i))}catch{}
    let body={};
    try{body=await response.json()}catch{}
    if(!response.ok||body.success===false){
      throw new Error(body.error?.code||body.error?.message||("HTTP "+response.status));
    }
    return body.data;
  }
  throw last||new Error("request failed");
}

  return{
    status,isLive:["running","at-station"].includes(status),delayMinutes:d.delay_minutes,
    lastUpdatedAt:d.last_reported_at,
    currentLocation:{stationCode:d.current_station_code,stationName:d.current_station_name,sequence:cur&&cur.sequence},
    nextHalt:{stationName:d.next_stop&&d.next_stop.station_name},
    route:st.map(s=>({

      status:s.has_departed||s.travelled?"departed":s.has_arrived?"arrived":"",

async function fetchLive(num){

  const order=["railradar","railcore"].filter(s=>have[s]);
  if(!order.length)throw new Error("Add a RailRadar or RailCore API key first.");
  for(const src of order){

      const cnt={};let bn=0;
      for(let dy=0;dy<k;dy++)for(let dx=0;dx<k;dx++){
        const x=minx+cx*k+dx,y=miny+cy*k+dy;if(x>maxx||y>maxy)continue;
        const v=g[y*C+x];if(v&&cv[v]){cnt[v]=(cnt[v]||0)+1;if(cnt[v]>bn){bn=cnt[v];best=v}}
      }
    }
    idm[cy*cols+cx]=best;
  }
  const at=(x,y)=>x<0||y<0||x>=cols||y>=rows?0:idm[y*cols+x];
  const cg=[];
  for(let y=0;y<rows;y++){const row=[];for(let x=0;x<cols;x++){
    const v=idm[y*cols+x];
    if(!v){row.push([" ",""]);continue}
    const edge=at(x-1,y)!==v||at(x+1,y)!==v||at(x,y-1)!==v||at(x,y+1)!==v;
    row.push(edge?["▒","mc"]:["·","ml"]);
  }cg.push(row)}
  const toC=p=>({
    x:Math.min(cols-1,Math.max(0,u>1?(p.x-minx)*u+Math.floor(u/2):Math.floor((p.x-minx)/k))),
    y:Math.min(rows-1,Math.max(0,u>1?(p.y-miny)*u+Math.floor(u/2):Math.floor((p.y-miny)/k)))
  });
  const pts=[];
  fp.forEach(p=>{const c=toC(p);c.code=p.code;const l=pts[pts.length-1];if(!l||l.x!==c.x||l.y!==c.y)pts.push(c)});
  const set=(x,y,ch,cls)=>{if(x>=0&&y>=0&&x<cols&&y<rows)cg[y][x]=[ch,cls]};
  for(let i=1;i<pts.length;i++)line(pts[i-1].x,pts[i-1].y,pts[i].x,pts[i].y,(x,y)=>set(x,y,"*","mr"));
  pts.forEach(p=>set(p.x,p.y,"o","ms"));
  /* labels: station codes for first, last and a few in between */
  const pick=new Set([0,pts.length-1]);
  if(pts.length>2)for(let q=1;q<7;q++)pick.add(Math.round(q*(pts.length-1)/7));
  const busy=Array.from({length:rows},()=>new Array(cols).fill(false));
  pts.forEach(p=>{busy[p.y][p.x]=true});
  [...pick].filter(i=>pts[i]).sort((a,b)=>a-b).forEach(i=>{
    const p=pts[i],code=String(p.code||"");
    const free=x0=>{
      if(x0<0||x0+code.length>cols)return false;
      for(let q=0;q<code.length;q++){const c=cg[p.y][x0+q];if(busy[p.y][x0+q]||c[1]==="mr"||c[1]==="ms")return false}
      return true;
    };
    const x0=free(p.x+2)?p.x+2:free(p.x-code.length-1)?p.x-code.length-1:-1;
    if(x0<0)return;
    for(let q=0;q<code.length;q++){cg[p.y][x0+q]=[code[q],"mt"];busy[p.y][x0+q]=true}
  });
  /* current position: blinking dot */
  const cp=ST.get(String(loc.stationCode||"").toUpperCase());
  const cur=loc.latitude!=null&&loc.longitude!=null?fine([+loc.latitude,+loc.longitude]):cp?fine(cp):null;
  if(cur){const c=toC(cur);set(c.x,c.y,"●","me")}
  let h2="";
  for(let y=0;y<rows;y++){
    let run="",cls=null;
    const flush=()=>{if(run)h2+=cls?'<span class="'+cls+'">'+run+"</span>":run;run=""};
    for(let x=0;x<cols;x++){
      const [ch,c]=cg[y][x];
      if(c==="me"){flush();h2+='<span class="me">●</span>';cls=null;continue}
      if(c!==cls){flush();cls=c}
      run+=ch;
    }
    flush();h2+="\n";
  }
  el.style.fontSize=Math.max(4,Math.min(12,(el.parentElement.clientWidth||320)/(cols*0.61)))+"px";
  el.innerHTML=h2;
  cap.textContent="states: "+order.map(id=>names[id-1]).join(" · ");
}

async function loadLive(force){
  if(!current)return;
  const num=current.number,ck="rr_live_"+num;
  let c=null;
  if(!force){
    try{const x=JSON.parse(localStorage.getItem(ck)||"null");if(x&&Date.now()-x.t<CACHE_MS)c=x}catch{}
  }
  if(!c){
    $("ds").textContent="loading live running status…";
    try{
      const r=await fetchLive(num);
      c={t:Date.now(),d:r.d,src:r.src,note:r.note};
      try{localStorage.setItem(ck,JSON.stringify(c))}catch{}
    }catch(e){
      if(current&&current.number===num){$("ds").textContent="Live status error: "+e.message;$("rcRow").hidden=false}
      return;
    }
  }
  if(!current||current.number!==num)return;
  $("rcRow").hidden=true;
  draw(c.d,c.t,c.src,c.note);
}
function draw(d,at,src,note){
  const loc=d.currentLocation||{},next=d.nextHalt||{};
  const updated=d.lastUpdatedAt?new Date(d.lastUpdatedAt).toLocaleTimeString():"not provided";
  const ago=Math.round((Date.now()-at)/1000);
  $("ds").innerHTML=
    '<span class="g">'+esc(String(d.status||"unknown").toUpperCase())+'</span> · '+
    (d.isLive?"LIVE":"NOT LIVE")+' · delay '+esc(d.delayMinutes??"—")+' min<br>'+
    'position: <span class="hi">'+esc(loc.stationName||loc.stationCode||"not reported")+'</span>'+
    (next.stationName?' · next: <span class="hi">'+esc(next.stationName)+'</span>':'')+
    '<br><span class="dim">source: '+esc(src||"railradar")+(note?" ("+esc(note)+")":"")+' · provider update: '+esc(updated)+' · fetched '+(ago<90?ago+"s":Math.round(ago/60)+"m")+' ago · cached 5 min · no auto-refresh</span>';
  const route=Array.isArray(d.route)?d.route:[];
  lastMap={route,loc};drawMap();
  $("map").innerHTML=route.map(s=>{
    const status=String(s.status||"").toLowerCase();
    const passed=["arrived","departed","passed"].includes(status);
    const isCurrent=loc.sequence===s.sequence||(loc.stationCode&&loc.stationCode===s.stationCode);
    const mark=isCurrent?'[<span class="me">●</span>]':passed?"[x]":"[ ]";
    const raw=s.actualArrival||s.actualDeparture||s.scheduledArrival||s.scheduledDeparture;
    const time=raw?new Date(raw).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"--:--";
    return '<span class="'+(isCurrent?"hi b":passed?"dim":"")+'">'+
      mark+'  '+esc(s.stationName||"").padEnd(24," ").slice(0,24)+' '+
      esc(s.stationCode||"").padEnd(6," ")+' '+esc(time)+'</span>';
  }).join("\n")||"No route details returned.";
  if(needScroll){
    needScroll=false;
    requestAnimationFrame(()=>{const m=document.querySelector("#map .me");if(m)glide(m)});
  }
}
let glideId=0;
function glide(el){
  const id=++glideId,r=el.getBoundingClientRect(),from=scrollY;
  const max=document.documentElement.scrollHeight-innerHeight;
  const to=Math.max(0,Math.min(max,from+r.top+r.height/2-innerHeight/2));
  const dist=Math.abs(to-from);if(dist<4)return;
  const dur=Math.min(2200,600+dist*0.9),t0=performance.now();
  const stop=()=>{glideId++};
  ["wheel","touchstart","keydown","pointerdown"].forEach(ev=>addEventListener(ev,stop,{once:true,passive:true}));
  (function f(now){
    if(id!==glideId)return;
    const p=Math.min(1,(now-t0)/dur),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
    scrollTo(0,from+(to-from)*e);
    if(p<1)requestAnimationFrame(f);
  })(t0);
}
function showSearch(){
  glideId++;current=null;
  $("detail").hidden=true;$("search").hidden=false;
  if(!matchMedia("(pointer:coarse)").matches)$("q").focus();

/* intro: matrix rain fills the screen, scrambles, then everything vanishes except the letters of "trains india", which decode in place */
(function(){
  const brand=$("brand");if(!brand)return;
  const cv=document.createElement("canvas");cv.id="mx";document.body.appendChild(cv);
  const ctx=cv.getContext("2d");
  const RAIN=2200,SCR=700,VAN=1000,END=RAIN+SCR+VAN+400,FS=12,CH=18,TITLE="trains india";
  const FF=getComputedStyle(document.body).fontFamily;
  const GL="ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾅﾆﾇﾈﾉ0123456789ABCDEF<>/|=+*:.".split("");
  const PAL=Array.from({length:12},(_,k)=>"rgba(63,220,110,"+((k+1)/12).toFixed(2)+")");
  const rnd=()=>GL[Math.random()*GL.length|0];
  const dpr=Math.min(devicePixelRatio||1,2);
  let W,H,CW,ox,oy,cols,rows,ch,br,vn,head,spd,tmap,done=false,t0=performance.now(),last=0;
  function init(){
    W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.font=FS+"px "+FF;CW=ctx.measureText("M").width||7.2;
    const rc=brand.getBoundingClientRect(),cy=rc.top+rc.height/2;
    ox=(rc.left%CW)-CW;oy=((cy-CH/2)%CH)-CH;
    cols=Math.ceil((W-ox)/CW);rows=Math.ceil((H-oy)/CH);
    const c0=Math.round((rc.left-ox)/CW),r0=Math.round((cy-CH/2-oy)/CH);
    ch=Array.from({length:cols*rows},rnd);br=new Float32Array(cols*rows);
    vn=Float32Array.from({length:cols*rows},()=>Math.random()*VAN);
    head=Array.from({length:cols},()=>-Math.random()*rows*.8);
    spd=Array.from({length:cols},()=>1+Math.random()*1.2);
    tmap=new Map();
    TITLE.split("").forEach((c,k)=>tmap.set(r0*cols+c0+k,{c,k,lock:Math.random()*500}));
  }
  init();
  function step(t){
    const vt=t-(RAIN+SCR);
    if(t<RAIN){
      for(let c=0;c<cols;c++){
        const prev=Math.floor(head[c]);head[c]+=spd[c];const now=Math.floor(head[c]);
        for(let r=Math.max(0,prev+1);r<=now&&r<rows;r++){const i=r*cols+c;br[i]=1;ch[i]=rnd()}
        if(head[c]>rows+Math.random()*12)head[c]=-Math.random()*rows*.4;
      }
      for(let i=0;i<br.length;i++)br[i]*=.985;
    }else if(vt<0){
      for(let i=0;i<br.length;i++){br[i]=.45+Math.random()*.55;ch[i]=rnd()}
    }else{
      tmap.forEach((o,i)=>{if(vt<o.lock){ch[i]=rnd();br[i]=1}});
    }
  }
  function draw(t){
    ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
    ctx.textBaseline="middle";
    const vt=t-(RAIN+SCR);
    ctx.font=FS+"px "+FF;
    for(let c=0;c<cols;c++){
      const hr=t<RAIN?Math.floor(head[c]):-1;
      for(let r=0;r<rows;r++){
        const i=r*cols+c,b=br[i],o=tmap.get(i);
        if(o&&vt>=o.lock)continue;
        if(b<.05||(vt>0&&vt>=vn[i]&&!o))continue;
        ctx.fillStyle=r===hr?"#d8ffe6":o&&vt>=0?"#9dffb8":PAL[Math.min(11,Math.floor(b*12))];
        ctx.fillText(ch[i],ox+c*CW,oy+r*CH+CH/2);
      }
    }
    if(vt>=0){
      tmap.forEach((o,i)=>{
        if(vt<o.lock||o.c===" ")return;
        const c=i%cols,r=Math.floor(i/cols),bold=o.k<6;
        ctx.font=(bold?"700 ":"")+FS+"px "+FF;
        ctx.fillStyle=bold?"#3fdc6e":"#6e6e6e";
        ctx.fillText(o.c,ox+c*CW,oy+r*CH+CH/2);
      });
    }
  }
  function finish(){
    if(done)return;done=true;
    ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
    brand.classList.add("on");
    cv.style.opacity="0";setTimeout(()=>cv.remove(),650);
    removeEventListener("keydown",finish);removeEventListener("pointerdown",finish);removeEventListener("resize",finish);
  }
  function frame(now){
    if(done)return;
    const t=now-t0;
    if(now-last>=45){last=now;step(t);draw(t)}
    if(t>=END)finish();else requestAnimationFrame(frame);
  }
  addEventListener("keydown",finish);addEventListener("pointerdown",finish);addEventListener("resize",finish);
  requestAnimationFrame(frame);
})();

</script>
